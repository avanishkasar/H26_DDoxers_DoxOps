name: doxops-ci

on:
  push:
    paths: ["doxops/**", ".github/workflows/doxops-ci.yml"]
  pull_request:
    paths: ["doxops/**", ".github/workflows/doxops-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: doxops
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv -p ${{ matrix.python }} .venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/python -m pytest -q
